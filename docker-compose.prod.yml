services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: algorace-backend-prod
    restart: always
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://yourdomain.com}
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx1024m -XX:+UseG1GC
    networks:
      - algorace-prod-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1200M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty string leverages Nginx reverse-proxy /api path on same domain
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: algorace-frontend-prod
    restart: always
    ports:
      - "${PROD_HTTP_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - algorace-prod-net
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

networks:
  algorace-prod-net:
    driver: bridge

