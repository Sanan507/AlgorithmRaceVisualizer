services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: algorace-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:3000}
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx512m
    networks:
      - algorace-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/catalog || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Defaults to empty string so API requests use the reverse-proxy '/api' path.
        # This prevents 'localhost:8080' browser connection failures when hosted on remote servers.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: algorace-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - algorace-net

networks:
  algorace-net:
    driver: bridge
